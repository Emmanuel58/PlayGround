<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Resident Evil 4 — Village Survival</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090b09;font-family:"Trebuchet MS",Arial,sans-serif;color:#ddd}
canvas{display:block;width:100%;height:100%;image-rendering:auto}.screen{position:absolute;inset:0}
#menu{display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 65% 42%,#47523b 0,#1a2118 28%,#090b09 68%);overflow:hidden}
#menu:before{content:"";position:absolute;width:55vmin;height:55vmin;border:2px solid rgba(200,210,170,.08);border-radius:50%;box-shadow:0 0 100px #000 inset,0 0 0 12vmin rgba(0,0,0,.12),0 0 0 24vmin rgba(0,0,0,.08)}
.menu-card{position:relative;width:min(520px,86vw);padding:32px 44px 38px;border-left:3px solid #9a1d18;background:linear-gradient(90deg,rgba(5,7,5,.94),rgba(5,7,5,.72),transparent)}
.eyebrow{letter-spacing:.48em;color:#a9b4a0;font-size:12px}.logo{font-family:Georgia,serif;font-size:clamp(44px,8vw,82px);line-height:.84;color:#eee;text-shadow:0 3px 0 #64120f,0 7px 18px #000;letter-spacing:-.07em}.logo i{display:block;font-style:normal;font-size:.38em;letter-spacing:.65em;color:#aaa;margin-left:.15em;margin-top:.28em}.menu-card h2{font-size:13px;letter-spacing:.32em;color:#c6cbbf;margin:28px 0 16px}.btn{display:block;width:230px;border:1px solid #596152;background:rgba(20,25,19,.88);color:#ddd;padding:13px 18px;margin:8px 0;font-size:13px;letter-spacing:.16em;text-align:left;cursor:pointer}.btn:hover,.btn:focus{background:#861914;border-color:#ba4a43;outline:none;transform:translateX(5px)}
.hud{pointer-events:none;display:none}.topbar{position:absolute;top:18px;left:22px;right:22px;display:flex;justify-content:space-between;align-items:flex-start}.status{width:250px}.status-title{font-size:10px;letter-spacing:.25em;color:#c3cab8}.health-box{margin-top:7px;height:12px;border:1px solid rgba(210,220,190,.35);background:rgba(0,0,0,.5);width:210px}.health{height:100%;width:100%;background:#b32620;box-shadow:0 0 12px #7e1712}.health.caution{background:#d39b31}.objective{font-size:11px;letter-spacing:.12em;text-align:right;text-shadow:0 2px 4px #000}.objective b{display:block;font-size:16px;letter-spacing:.06em;margin-top:5px;color:#e8eadf}
.weapon{position:absolute;right:24px;bottom:25px;text-align:right;text-shadow:0 2px 5px #000}.weapon-name{font-size:11px;letter-spacing:.22em}.ammo{font-family:Georgia,serif;font-size:46px}.ammo small{font-size:16px;color:#aaa}.crosshair{position:absolute;left:50%;top:50%;width:24px;height:24px;margin:-12px 0 0 -12px}.crosshair:before,.crosshair:after{content:"";position:absolute;background:rgba(255,255,255,.85);box-shadow:0 0 2px #000}.crosshair:before{width:2px;height:24px;left:11px}.crosshair:after{height:2px;width:24px;top:11px}
.toast{position:absolute;left:50%;bottom:100px;transform:translateX(-50%);padding:9px 18px;background:rgba(8,10,8,.82);border-top:1px solid #aaa;border-bottom:1px solid #aaa;font-size:12px;letter-spacing:.12em;opacity:0;transition:.25s}.toast.show{opacity:1}.gameover{display:none;align-items:center;justify-content:center;background:rgba(5,6,5,.82)}.gameover-card{text-align:center}.gameover-card h1{font-family:Georgia,serif;font-size:64px;margin:0 0 20px;color:#a62923}.touch{display:none}.touch button{position:absolute;border:1px solid rgba(230,235,220,.25);border-radius:50%;background:rgba(20,25,20,.48);color:white;width:64px;height:64px;font-size:18px}.stick{left:20px;bottom:25px;border-radius:50%;width:150px!important;height:150px!important}.touch-fire{right:20px;bottom:32px;width:78px!important;height:78px!important}.touch-reload{right:112px;bottom:28px;width:62px!important;height:62px!important;font-size:11px}
@media (pointer:coarse),(max-width:800px){.touch{display:block}.crosshair{display:none}.weapon{bottom:135px}.topbar{top:10px}.status{width:180px}.health-box{width:150px}}
</style></head>
<body>
<div id="menu" class="screen"><div class="menu-card"><div class="eyebrow">CAPCOM PRESENTS</div><div class="logo">RESIDENT EVIL <i>4</i></div><h2>VILLAGE SURVIVAL</h2><button class="btn" id="start">▶ START GAME</button><button class="btn" id="how">? HOW TO PLAY</button></div></div>
<canvas id="game"></canvas>
<div id="hud" class="hud screen"><div class="topbar"><div class="status"><div class="status-title">VITALITY</div><div class="health-box"><div id="health" class="health"></div></div></div><div class="objective">OBJECTIVE <b id="objective">Survive the village</b></div></div><div class="crosshair"></div><div class="weapon"><div class="weapon-name">BLACKTAIL</div><div class="ammo"><span id="ammo">15</span><small> / <span id="reserve">60</span></small></div></div><div id="toast" class="toast"></div></div>
<div id="over" class="screen gameover"><div class="gameover-card"><h1 id="endtitle">YOU ARE DEAD</h1><p id="endtext">The village claims another victim.</p><button class="btn" id="again" style="margin:24px auto">TRY AGAIN</button></div></div>
<div id="touch" class="touch"><button id="stick" class="stick"></button><button id="reload" class="touch-reload">RLD</button><button id="fire" class="touch-fire">FIRE</button></div>
<script src="game.js"></script>
</body></html>
